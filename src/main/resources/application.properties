spring.application.name=Blog-App-Apis
#port
server.port=9090
# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/blog_app_apis?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
# MySQL Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# MySQL Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#logs
logging.level.root=INFO
logging.file.name=logs/blog-app.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d %-5level %logger - %msg%n
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
#upload image path
project.image=images/

#redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

